AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Mock Draft - serverless API

Parameters:
  GoogleClientId:
    Type: String
    Description: >-
      OAuth 2.0 client ID from the Google Cloud project. Required: the API's
      JWT authorizer references the user pool this creates.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >-
      OAuth 2.0 client secret. NoEcho keeps it out of console output and stack
      events. Pass it at deploy time from SSM; never commit it.
  SiteUrl:
    Type: String
    Description: Origin the hosted sign-in returns to.
    Default: "https://d2kf4b52rvabfv.cloudfront.net"
  AuthDomainPrefix:
    Type: String
    Description: Prefix for the Cognito hosted sign-in domain.
    Default: "perfectpick-auth"
  YahooClientId:
    Type: String
    Description: Yahoo OAuth client id. Not secret.
  YahooClientSecret:
    Type: String
    NoEcho: true
    Description: >
      Yahoo OAuth client secret. NoEcho keeps it out of console output and
      stack events -- it does NOT keep it out of samconfig.toml, which this
      repo tracks in git. Pass it explicitly at deploy, never with --guided.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256

Resources:

  # --- Identity ----------------------------------------------------------
  #
  # Google is the only provider: no password is ever set, stored, or reset
  # here, and API Gateway can verify this pool's JWTs natively, so no token
  # verification code is written or maintained in this project.

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: perfectpick-users
      # Google is the sole provider, so email arrives already verified and
      # there is no self-service sign-up path to secure.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      AutoVerifiedAttributes:
        - email

  UserPoolGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # Without this the client can be created before the provider exists and
    # SupportedIdentityProviders fails to resolve.
    DependsOn: UserPoolGoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: perfectpick-web
      # A browser cannot keep a secret, so this is a public client and the
      # flow is authorization code with PKCE.
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - !Sub "${SiteUrl}/auth/callback"
        - "http://localhost:5173/auth/callback"
      LogoutURLs:
        - !Ref SiteUrl
        - "http://localhost:5173"
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref AuthDomainPrefix

  DraftsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-drafts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: draftId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: draftId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # "My drafts" is a query, not a scan. The projection deliberately
        # excludes `picks`, which is the whole draft board and would make every
        # list read as expensive as loading the draft itself.
        - IndexName: byOwner
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - teams
              - rounds
              - format
              - userTeam
              - boardId
              - currentIndex
              - createdAt
  # seats already says who is in a draft, but seats is a list and a DynamoDB
  # index cannot be built on a list, so membership gets its own rows here.
  # The seat is still the truth -- GET /drafts/{draftId} gates on isSeated and
  # never on this table -- so a row here is a cache used only for listing.
  DraftMembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sub
          AttributeType: S
        - AttributeName: draftId
          AttributeType: S
      KeySchema:
        - AttributeName: sub
          KeyType: HASH
        - AttributeName: draftId
          KeyType: RANGE
  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sport
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: sport
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
  BoardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-boards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: boardId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: boardId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOwner
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - name
              - format
              - season
              - updatedAt

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No DefaultAuthorizer on purpose. Reads are no longer uniformly
      # public -- a draft or board opens only for the people in it -- but
      # /players still is, so protection stays opt-in per route and
      # template.test.js asserts both lists rather than one rule.
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        # A signed-in request is preflighted because of its Authorization
        # header; without it here the browser refuses to send the real request.
        AllowHeaders: ["content-type", "authorization"]
        AllowOrigins:
          - "https://d2kf4b52rvabfv.cloudfront.net"

  PlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: players.handler
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players
            Method: GET
        GetPlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players/{playerId}
            Method: GET

  DraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: drafts.handler
      Environment:
        Variables:
          DRAFTS_TABLE: !Ref DraftsTable
          PLAYERS_TABLE: !Ref PlayersTable
          DRAFT_MEMBERS_TABLE: !Ref DraftMembersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftMembersTable
      Events:
        CreateDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        JoinDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/join
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        Pick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/pick
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        AutoPick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/auto-pick
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        ExpireDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/expire
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        SimToEnd:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/sim-to-end
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        DeleteDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuth
  SyncPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: syncPlayers.handler
      # 60 was ample when the sync only wrote. It now also prunes rows the run
      # did not rewrite and fetches 18 weekly stat payloads (~3.4s measured),
      # and those three costs share one budget.
      Timeout: 120
      # 512 was sized before this job also parsed ESPN's ADP payload, which is
      # 9.8MB at the depth we fetch, on top of Sleeper's 14.6MB dump.
      MemorySize: 1024
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ADP_TEAMS: 12
          ADP_YEAR: 2026
          ADP_FORMAT: standard
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  BoardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: boards.handler
      Environment:
        Variables:
          BOARDS_TABLE: !Ref BoardsTable
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        CreateBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        SaveBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuth
        DeleteBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuth

  YahooFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: yahoo.handler
      # Above the global 10s, which the fetch timeout in yahoo.js would
      # otherwise collide with exactly: a merely-slow Yahoo would be killed by
      # the platform before our own abort fired, so the friendly "could not
      # confirm that sign-in" message could never actually be sent. The
      # headroom also covers Task 6, which adds a second call to fetch the
      # leagues after the token exchange.
      Timeout: 20
      Environment:
        Variables:
          YAHOO_CLIENT_ID: !Ref YahooClientId
          YAHOO_CLIENT_SECRET: !Ref YahooClientSecret
          YAHOO_REDIRECT_URI: "https://d2kf4b52rvabfv.cloudfront.net/yahoo/callback"
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Events:
        YahooLeagues:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /yahoo/leagues
            Method: POST
            Auth:
              Authorizer: CognitoAuth

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: me.handler
      Environment:
        Variables:
          DRAFTS_TABLE: !Ref DraftsTable
          BOARDS_TABLE: !Ref BoardsTable
          DRAFT_MEMBERS_TABLE: !Ref DraftMembersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DraftMembersTable
      Events:
        MyDrafts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/drafts
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        MyBoards:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/boards
            Method: GET
            Auth:
              Authorizer: CognitoAuth

Outputs:

  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id for the web app
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Hosted sign-in domain
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ApiBaseUrl:
    Description: Base URL for HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"