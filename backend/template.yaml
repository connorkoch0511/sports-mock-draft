AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Mock Draft - serverless API

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256

Resources:
  DraftsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-drafts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: draftId
          AttributeType: S
      KeySchema:
        - AttributeName: draftId
          KeyType: HASH
  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sport
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: sport
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
  BoardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-boards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: boardId
          AttributeType: S
      KeySchema:
        - AttributeName: boardId
          KeyType: HASH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        AllowHeaders: ["content-type"]
        AllowOrigins:
          - "https://d2kf4b52rvabfv.cloudfront.net"

  PlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: players.handler
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players
            Method: GET
        GetPlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players/{playerId}
            Method: GET

  DraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: drafts.handler
      Environment:
        Variables:
          DRAFTS_TABLE: !Ref DraftsTable
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        CreateDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts
            Method: POST
        GetDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: GET
        Pick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/pick
            Method: POST
        AutoPick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/auto-pick
            Method: POST
        SimToEnd:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/sim-to-end
            Method: POST
        DeleteDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: DELETE
  SyncPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: syncPlayers.handler
      # 60 was ample when the sync only wrote. It now also prunes rows the run
      # did not rewrite and fetches 18 weekly stat payloads (~3.4s measured),
      # and those three costs share one budget.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ADP_TEAMS: 12
          ADP_YEAR: 2026
          ADP_FORMAT: standard
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  BoardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: boards.handler
      Environment:
        Variables:
          BOARDS_TABLE: !Ref BoardsTable
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        CreateBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards
            Method: POST
        GetBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: GET
        SaveBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: PUT
        DeleteBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: DELETE

Outputs:
  ApiBaseUrl:
    Description: Base URL for HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"