AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Mock Draft - serverless API

Parameters:
  GoogleClientId:
    Type: String
    Description: >-
      OAuth 2.0 client ID from the Google Cloud project. Required: the API's
      JWT authorizer references the user pool this creates.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >-
      OAuth 2.0 client secret. NoEcho keeps it out of console output and stack
      events. Pass it at deploy time from SSM; never commit it.
  SiteUrl:
    Type: String
    Description: Origin the hosted sign-in returns to.
    Default: "https://d2kf4b52rvabfv.cloudfront.net"
  AuthDomainPrefix:
    Type: String
    Description: Prefix for the Cognito hosted sign-in domain.
    Default: "perfectpick-auth"

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256

Resources:

  # --- Identity ----------------------------------------------------------
  #
  # Google is the only provider: no password is ever set, stored, or reset
  # here, and API Gateway can verify this pool's JWTs natively, so no token
  # verification code is written or maintained in this project.

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: perfectpick-users
      # Google is the sole provider, so email arrives already verified and
      # there is no self-service sign-up path to secure.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      AutoVerifiedAttributes:
        - email

  UserPoolGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # Without this the client can be created before the provider exists and
    # SupportedIdentityProviders fails to resolve.
    DependsOn: UserPoolGoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: perfectpick-web
      # A browser cannot keep a secret, so this is a public client and the
      # flow is authorization code with PKCE.
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - !Sub "${SiteUrl}/auth/callback"
        - "http://localhost:5173/auth/callback"
      LogoutURLs:
        - !Ref SiteUrl
        - "http://localhost:5173"
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref AuthDomainPrefix

  DraftsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-drafts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: draftId
          AttributeType: S
      KeySchema:
        - AttributeName: draftId
          KeyType: HASH
  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sport
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: sport
          KeyType: HASH
        - AttributeName: playerId
          KeyType: RANGE
  BoardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: perfectpick-boards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: boardId
          AttributeType: S
      KeySchema:
        - AttributeName: boardId
          KeyType: HASH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No DefaultAuthorizer on purpose. Reads stay public -- a shared link
      # must still open -- so protection is opted into route by route, and
      # template.test.js is what makes sure nobody forgets to opt in.
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        # A signed-in request is preflighted because of its Authorization
        # header; without it here the browser refuses to send the real request.
        AllowHeaders: ["content-type", "authorization"]
        AllowOrigins:
          - "https://d2kf4b52rvabfv.cloudfront.net"

  PlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: players.handler
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players
            Method: GET
        GetPlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /players/{playerId}
            Method: GET

  DraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: drafts.handler
      Environment:
        Variables:
          DRAFTS_TABLE: !Ref DraftsTable
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        CreateDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Pick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/pick
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        AutoPick:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/auto-pick
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        SimToEnd:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}/sim-to-end
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        DeleteDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /drafts/{draftId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuth
  SyncPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: syncPlayers.handler
      # 60 was ample when the sync only wrote. It now also prunes rows the run
      # did not rewrite and fetches 18 weekly stat payloads (~3.4s measured),
      # and those three costs share one budget.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          ADP_TEAMS: 12
          ADP_YEAR: 2026
          ADP_FORMAT: standard
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  BoardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: boards.handler
      Environment:
        Variables:
          BOARDS_TABLE: !Ref BoardsTable
          PLAYERS_TABLE: !Ref PlayersTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayersTable
      Events:
        CreateBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        SaveBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuth
        DeleteBoard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /boards/{boardId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuth

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: me.handler
      Environment:
        Variables:
          DRAFTS_TABLE: !Ref DraftsTable
          BOARDS_TABLE: !Ref BoardsTable
          ALLOWED_ORIGIN: "https://d2kf4b52rvabfv.cloudfront.net"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DraftsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardsTable
      Events:
        Claim:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/claim
            Method: POST
            Auth:
              Authorizer: CognitoAuth

Outputs:

  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id for the web app
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Hosted sign-in domain
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ApiBaseUrl:
    Description: Base URL for HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"